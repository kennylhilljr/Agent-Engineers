<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Agentic Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --bg-hover: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --accent-blue: #58a6ff;
            --accent-blue-dark: #1f6feb;
            --accent-green: #3fb950;
            --accent-yellow: #d29922;
            --accent-red: #f85149;
            --accent-purple: #bc8cff;
            --shadow: rgba(0, 0, 0, 0.4);
            --radius: 8px;
            --radius-lg: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        a { color: var(--accent-blue); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 1.5rem; }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .header-logo svg { width: 28px; height: 28px; color: var(--accent-blue); }

        .nav-tabs { display: flex; gap: 0; height: 64px; }

        .nav-tab {
            display: flex;
            align-items: center;
            padding: 0 1.25rem;
            height: 100%;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: color 0.15s ease, border-color 0.15s ease;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-tab:hover { color: var(--text-secondary); text-decoration: none; }
        .nav-tab.active { color: var(--text-primary); border-bottom-color: var(--accent-blue); }

        .header-right { display: flex; align-items: center; gap: 1rem; }

        .user-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--accent-blue-dark);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 600; color: #fff; cursor: pointer;
        }

        /* Page */
        .page-content { max-width: 1280px; margin: 0 auto; padding: 2rem; }

        .breadcrumb {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .breadcrumb a { color: var(--text-muted); }
        .breadcrumb a:hover { color: var(--accent-blue); }

        .page-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .page-title { font-size: 1.5rem; font-weight: 600; }

        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.5rem 1rem; border-radius: var(--radius);
            font-size: 0.875rem; font-weight: 500; cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary); color: var(--text-secondary);
            transition: background 0.15s ease;
        }

        .btn:hover { background: var(--bg-hover); text-decoration: none; }

        .btn-primary {
            background: var(--accent-blue-dark);
            border-color: var(--accent-blue-dark); color: #fff;
        }

        .btn-primary:hover { background: var(--accent-blue); border-color: var(--accent-blue); }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .filter-btn {
            padding: 0.4rem 0.875rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-muted);
            transition: all 0.15s ease;
        }

        .filter-btn:hover { border-color: var(--accent-blue); color: var(--text-secondary); }

        .filter-btn.active {
            background: var(--accent-blue-dark);
            border-color: var(--accent-blue-dark);
            color: #fff;
        }

        /* Project Cards Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1rem;
        }

        .project-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.25rem 1.5rem;
            cursor: pointer;
            transition: border-color 0.15s ease, transform 0.1s ease;
        }

        .project-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-1px);
        }

        .project-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .project-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .status-badge .dot {
            width: 6px; height: 6px; border-radius: 50%;
        }

        .status-badge.active { background: rgba(63,185,80,0.15); color: var(--accent-green); }
        .status-badge.active .dot { background: var(--accent-green); }

        .status-badge.completed { background: rgba(88,166,255,0.15); color: var(--accent-blue); }
        .status-badge.completed .dot { background: var(--accent-blue); }

        .status-badge.pending { background: rgba(210,153,34,0.15); color: var(--accent-yellow); }
        .status-badge.pending .dot { background: var(--accent-yellow); }

        .status-badge.error { background: rgba(248,81,73,0.15); color: var(--accent-red); }
        .status-badge.error .dot { background: var(--accent-red); }

        .project-meta {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .project-meta-row {
            display: flex;
            justify-content: space-between;
        }

        .project-meta-label { color: var(--text-muted); }
        .project-meta-value { color: var(--text-secondary); }

        /* Loading / Empty / Error */
        .loading-state {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 4rem 1rem; color: var(--text-muted); font-size: 0.875rem;
        }

        .spinner {
            width: 24px; height: 24px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 0.75rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center; padding: 4rem 1rem;
            color: var(--text-muted); font-size: 0.875rem;
        }

        .error-banner {
            background: rgba(248,81,73,0.1);
            border: 1px solid rgba(248,81,73,0.3);
            border-radius: var(--radius);
            padding: 0.75rem 1rem; color: var(--accent-red);
            font-size: 0.85rem; margin-bottom: 1rem; display: none;
        }

        .error-banner.visible { display: block; }

        /* Responsive */
        @media (max-width: 768px) {
            .header { padding: 0 1rem; }
            .page-content { padding: 1rem; }
            .projects-grid { grid-template-columns: 1fr; }
            .nav-tabs { display: none; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="header-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
                </svg>
                Agentic Platform
            </div>
            <nav class="nav-tabs">
                <a href="customer_dashboard.html" class="nav-tab">Dashboard</a>
                <a href="customer_projects.html" class="nav-tab active">Projects</a>
                <a href="customer_agents.html" class="nav-tab">Agents</a>
                <a href="customer_specs.html" class="nav-tab">Specs</a>
            </nav>
        </div>
        <div class="header-right">
            <div class="user-avatar" title="Account">U</div>
        </div>
    </header>

    <div class="page-content">
        <div class="error-banner" id="errorBanner"></div>

        <div class="breadcrumb">
            <a href="customer_dashboard.html">Dashboard</a> / <span>Projects</span>
        </div>

        <div class="page-title-row">
            <h1 class="page-title">Projects</h1>
            <a href="customer_specs.html" class="btn btn-primary">+ Submit New Spec</a>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
        </div>

        <div id="projectsContainer">
            <div class="loading-state">
                <div class="spinner"></div>
                Loading projects...
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let allProjects = [];
        let currentFilter = 'all';

        async function apiFetch(path) {
            const res = await fetch(`${API_BASE}${path}`);
            if (!res.ok) throw new Error(`API ${path} returned ${res.status}`);
            return res.json();
        }

        function showError(msg) {
            const el = document.getElementById('errorBanner');
            el.textContent = msg;
            el.classList.add('visible');
        }

        function timeAgo(dateStr) {
            if (!dateStr) return 'N/A';
            const diff = Date.now() - new Date(dateStr).getTime();
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return 'just now';
            if (mins < 60) return `${mins}m ago`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            return `${days}d ago`;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function renderProjects() {
            const container = document.getElementById('projectsContainer');
            const filtered = currentFilter === 'all'
                ? allProjects
                : allProjects.filter(p => p.status === currentFilter);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state">
                    ${currentFilter === 'all'
                        ? 'No projects yet. Submit a spec to get started.'
                        : `No ${currentFilter} projects found.`}
                </div>`;
                return;
            }

            container.innerHTML = `<div class="projects-grid">
                ${filtered.map(p => `
                    <div class="project-card" onclick="window.location.href='customer_projects.html?id=${encodeURIComponent(p.id)}'">
                        <div class="project-card-header">
                            <div class="project-name">${escapeHtml(p.name)}</div>
                            <span class="status-badge ${p.status}">
                                <span class="dot"></span>
                                ${p.status}
                            </span>
                        </div>
                        <div class="project-meta">
                            <div class="project-meta-row">
                                <span class="project-meta-label">Spec</span>
                                <span class="project-meta-value">${escapeHtml(p.spec_name || 'Unnamed')}</span>
                            </div>
                            <div class="project-meta-row">
                                <span class="project-meta-label">Agent</span>
                                <span class="project-meta-value">${escapeHtml(p.agent_name || 'Unassigned')}</span>
                            </div>
                            <div class="project-meta-row">
                                <span class="project-meta-label">Last Activity</span>
                                <span class="project-meta-value">${timeAgo(p.last_activity)}</span>
                            </div>
                        </div>
                    </div>
                `).join('')}
            </div>`;
        }

        async function loadProjects() {
            try {
                const data = await apiFetch('/api/tenant/projects');
                allProjects = data.projects || data;
                renderProjects();
            } catch (err) {
                console.error('Projects load error:', err);
                showError(`Failed to load projects: ${err.message}`);
                document.getElementById('projectsContainer').innerHTML =
                    '<div class="empty-state">Unable to load projects. Check your connection.</div>';
            }
        }

        // Filter bar
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderProjects();
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadProjects();
            setInterval(loadProjects, 30000);
        });
    </script>
</body>
</html>
